services:
  - type: web
    name: vk-bouwmaster
    env: node
    # Starter = 512MB RAM; Next.js `npm run build` often exceeds that and the deploy fails.
    # Standard = 2GB — required for reliable Next.js builds on Render.
    plan: standard
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    # Fast JSON route; avoid depending on full-page SSR for deploy readiness.
    healthCheckPath: /api/health
    # Persistent disk is required if you want reviews/messages to survive restarts & deploys.
    disk:
      name: vk-bouwmaster-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Predictable heap on Standard (2GB) instances; keeps headroom for native deps + OS.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      # @vercel/blob pulls AWS SDK — stops pointless EC2 metadata probes (169.254.169.254) on Render.
      - key: AWS_EC2_METADATA_DISABLED
        value: "true"
      # Runtime storage paths (use Render persistent disk)
      - key: COMMENTS_FILE_PATH
        value: /var/data/comments-data.json
      - key: CONTACT_FILE_PATH
        value: /var/data/contact-data.json
      - key: CONTACT_MESSAGES_FILE_PATH
        value: /var/data/contact-messages.json
      # Admin-edited JSON (same persistent disk — survives deploys; optional locally via defaults in src/lib or data/)
      - key: WORKS_FILE_PATH
        value: /var/data/works-data.json
      - key: SERVICES_FILE_PATH
        value: /var/data/services-data.json
      - key: PORTFOLIO_FILE_PATH
        value: /var/data/portfolio-data.json
      - key: TEAM_FILE_PATH
        value: /var/data/team-data.json
      - key: BLOG_FILE_PATH
        value: /var/data/blog-data.json
      - key: FAQ_FILE_PATH
        value: /var/data/faq-data.json
      - key: PRICING_FILE_PATH
        value: /var/data/pricing-data.json
      # User-uploaded images/videos (same disk as JSON). Optional: if unset, app uses /var/data/uploads when /var/data exists.
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Services/works/FAQ/blog: fill missing translations on GET (disable with "false" if cold starts time out).
      - key: AUTO_TRANSLATE_ON_FETCH
        value: "true"
      # ВАЖНО: Добавьте следующие переменные окружения в настройках Render через веб-интерфейс:
      # Settings → Environment → Add Environment Variable
      # 
      # Для отправки email (опционально):
      # SMTP_HOST=your-smtp-host
      # SMTP_PORT=587
      # SMTP_USER=your-email
      # SMTP_PASS=your-password
      # RECIPIENT_EMAIL=your-recipient-email
      # EMAIL_TO тоже поддерживается, но лучше использовать RECIPIENT_EMAIL
      #
      # Для Telegram уведомлений (опционально):
      # TELEGRAM_BOT_TOKEN=123456:ABCDEF-your-token
      # TELEGRAM_CHAT_ID=123456789
      #
      # Для переводов (опционально):
      # OPENAI_API_KEY=your-openai-key
      #
      # Для загрузки файлов (опционально):
      # BLOB_READ_WRITE_TOKEN=your-blob-token

